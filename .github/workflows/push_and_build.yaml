name: Build & Release

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_release:
    runs-on: ubuntu-latest

    steps:
      # 1. checkout 代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 安装 Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # 3. 安装依赖
      - name: Install dependencies
        run: npm ci --verbose

      # 4. Build
      - name: Build
        run: npm run build

      # 5. 仅 tag 构建时打包产物
      - name: Package build
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir release
          cp -r dist release/dist
          cd release
          zip -r ../release.zip .

      # 6. 仅 tag 构建时创建 Release
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}